        <!-- Sisäänkirjautumis modal -->
    <div id="id01" class="modal">
        <form class="modal-content" action="">

            <span onclick="hideModal()" class="close" title="Close">&times;</span>

            <div class="modal-container">
                <h2>Welcome Back!</h2>

                <label for="uname">Username</label>
                <input type="text" placeholder="Enter Username" name="uname" required="">

                <label for="psw">Password</label>
                <input type="password" placeholder="Enter Password" name="psw" required="">

                <label>
                <input type="checkbox" checked="checked" name="remember"> Remember me
                </label>
                <button type="submit">Login</button>
            </div>

            <div class="modal-container" style="background-color:#10003c">
                <span class="signup">Don't have an account? Create an <a onclick="modalChange()" href="#">account</a></span>
            </div>
        </form>
    </div>

    <!-- Tilin luonti modal -->
    <div id="id02" class="modal">
        <form class="modal-content" action="">

            <span onclick="hideModal()" class="close" title="Close">&times;</span>

            <div class="modal-container">
                <h2>Create an account</h2>

                <label for="mail">Email</label>
                <input type="email" placeholder="Enter Email Address" name="mail" required="">

                <label for="uname">Username</label>
                <input type="text" placeholder="Enter Username" name="uname" required="">

                <label for="psw">Password</label>
                <input type="password" placeholder="Enter Password" name="psw" required="">

                <button type="submit">Sign Up</button>
            </div>

            <div class="modal-container" style="background-color:#10003c">
                <span class="signup">Already have an account? <a onclick="modalChange()" href="#">Log in</a></span>
            </div>
        </form>
    </div>

    <script src="/BACKEND/script.js"></script>
    <script src="modal_script.js"></script>
